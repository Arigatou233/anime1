/* Reference screenshot layout override */

.nav{gap:10px}.brand{font-size:25px;min-width:max-content}.mark{width:48px;height:48px;border-radius:50%}

.hero:before,.hero:after{display:none}.hero .wrap{z-index:2}

function render(){
 const q=$("search").value.trim().toLowerCase(),s=$("season").value,y=$("year").value;
 const seasonOrder={"春季":0,"夏季":1,"秋季":2,"冬季":3};
 const list=records.filter(a=>(!q||String(a.title||"").toLowerCase().includes(q))&&(!s||a.season===s)&&(!y||String(a.year)===y));
 // 按年份从新到旧；同一年按春、夏、秋、冬排列，未填写信息的番剧放在最后。
 list.sort((a,b)=>{
   const ay=Number(a.year)||0,by=Number(b.year)||0;
   if(ay!==by)return by-ay;
   const as=seasonOrder[a.season]??99,bs=seasonOrder[b.season]??99;
   if(as!==bs)return as-bs;
   return String(a.title||"").localeCompare(String(b.title||""),"zh-CN");
 });
 const cardHtml=a=>{let cs=cuts.filter(c=>String(c.anime_id)===String(a.id));const episodeCount=new Set(cs.map(c=>String(c.episode??c.episode_number??c.episode_no??"未填写"))).size;const coverUrl=a.cover_url||a.cover_image_url||a.cover_image||a.poster_url||a.image_url||a.cover||"";return `<article class="card"><div class="cover">${coverUrl?`<img src="${esc(coverUrl)}" alt="${esc(a.title)} 封面" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;cover-fallback&quot;>🎞️</span>'">`:'<span class="cover-fallback">🎞️<small>暂无封面</small></span>'}</div><div class="card-main"><h3>${esc(a.title)}</h3><div class="muted card-meta"><span class="pill">${esc(a.category||"TV动画")}</span><span class="pill">${esc(a.season||"季度待补")}</span><span class="card-year">${esc(a.year||"年份待补")}年</span></div><div class="card-bottom"><span class="pill record-count">${episodeCount} 集 · ${cs.length} 条记录</span><div class="card-actions"><button class="btn plain" onclick="showDetail('${a.id}')">查看详情</button>${isAdmin?`<button class="btn plain" onclick="editAnime('${a.id}')">编辑</button><button class="btn plain danger" onclick="deleteAnime('${a.id}')">删除</button>`:""}</div></div></div></article>`};
 if(!list.length){$("cards").innerHTML='<div class="panel" style="grid-column:1/-1">暂无符合条件的公开番剧记录。</div>';return;}
 const groups=new Map();
 list.forEach(a=>{const year=a.year?`${a.year} 年`:`年份待补`,season=a.season||"季度待补",key=`${year}｜${season}`;if(!groups.has(key))groups.set(key,{year:a.year,season,items:[]});groups.get(key).items.push(a);});
 $("cards").innerHTML=[...groups.values()].map(g=>`<section class="season-group"><h3 class="season-heading"><span>📅 ${esc(g.year||"年份待补")} · ${esc(g.season)}</span><span class="season-count">${g.items.length} 部</span></h3> <div class="season-items">${g.items.map(cardHtml).join("")}</div></section>`).join("");
}

 <div class="full"><label>封面图片 URL *</label><input class="field" id="editCoverUrl" name="cover_url" type="url" required value="${esc(coverValue)}" placeholder="粘贴可公开访问的图片直链"><div style="display:flex;align-items:center;gap:12px;margin-top:8px"><img id="editCoverPreview" src="${esc(coverValue)}" alt="封面预览" style="width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #dce7fb;${coverValue?'':'display:none'}" onerror="this.style.display='none'"><small class="muted">封面链接必填；请使用无需登录即可访问的图片直链。</small></div></div>

 };
};

function showDetail(id){
 const a=records.find(x=>String(x.id)===String(id)),cs=cuts.filter(c=>String(c.anime_id)===String(id));
 if(!a){toast("找不到这部番剧");return}
 const coverUrl=a.cover_url||a.cover_image_url||a.cover_image||a.poster_url||a.image_url||a.cover||"";
 const cover=coverUrl?`<img src="${esc(coverUrl)}" alt="${esc(a.title)} 封面" loading="lazy" class="detail-cover" onerror="this.style.display='none'">`:`<div class="detail-cover-placeholder">🎞️</div>`;
 const episodeMap=new Map();
 cs.forEach(c=>{const ep=c.episode??c.episode_number??c.episode_no??"未填写";const key=String(ep);if(!episodeMap.has(key))episodeMap.set(key,[]);episodeMap.get(key).push(c)});
 const episodeEntries=[...episodeMap.entries()].sort((a,b)=>{const an=Number(a[0]),bn=Number(b[0]);if(Number.isFinite(an)&&Number.isFinite(bn))return an-bn;if(Number.isFinite(an))return -1;if(Number.isFinite(bn))return 1;return a[0].localeCompare(b[0],"zh-CN")});
 const cutHtml=episodeEntries.length?`<div class="cut-section-head"><div><h3>记录</h3><p>同一集的多个时间点已归在一起</p></div><span class="cut-total">${cs.length} 条记录</span></div><div class="episode-list">${episodeEntries.map(([ep,items])=>`<section class="episode-card"><div class="episode-heading"><span class="episode-number">第 ${esc(ep)} 集</span><span class="episode-count">${items.length} 个时间点</span></div><div class="episode-points">${items.map((c,i)=>{const tp=c.time_point??c.timepoint??c.cut_time??"未知",desc=c.description??c.cut_description??c.summary??c.overview??c.note??"暂无说明";return `<article class="point-row"><div class="point-content"><span class="point-time">◷ ${esc(tp)}</span><span class="point-type">${esc(desc)}</span></div>${isAdmin?`<button class="btn plain point-edit" onclick="editCutRecord('${c.id}')">编辑</button>`:""}</article>`}).join("")}</div></section>`).join("")}</div>`:'<div class="empty-cuts"><span>✦</span><b>暂未收录删减记录</b><p>添加记录后，每集的时间点会自动归类显示。</p></div>';

 $("editCutForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),episode=Number(f.get("episode")),time_point=String(f.get("time_point")||"").trim(),description=String(f.get("description")||"").trim();if(!episode||episode<1||!time_point||!description){toast("请填写集数、时间点和删减概况");return}const r=await db.from("cut_records").update({episode,time_point,description}).eq("id",id);if(r.error){toast("修改失败："+r.error.message+"。请确认 cut_records 的管理员更新权限。");return}closeModal();toast("删减记录已更新");await refresh();showDetail(c.anime_id)};

async function authSubmit(mode){
 const f=$("authForm"),feedback=$("authFeedback");
 if(!f||!db){toast("登录服务不可用，请刷新页面后重试");return}
 const email=f.querySelector('[name="email"]').value.trim(), password=f.querySelector('[name="password"]').value;
 if(!email||!f.querySelector('[name="email"]').checkValidity()){feedback.style.display="block";feedback.textContent="请输入有效的邮箱地址。";return}
 if(password.length<6){feedback.style.display="block";feedback.textContent="密码至少需要 6 位。";return}
 const buttons=[$("signupAction"),$("signinAction")];buttons.forEach(b=>b.disabled=true);feedback.style.display="block";feedback.textContent=mode==="signup"?"正在创建账号……":"正在登录……";
 try{
   const r=mode==="signup"?await db.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}}):await db.auth.signInWithPassword({email,password});
   if(r.error){feedback.textContent="操作失败："+r.error.message;return}
   if(mode==="signup"){
     if(r.data.session){toast("注册成功，已自动登录");closeModal();await refresh();}
     else {feedback.textContent="注册请求已提交。请检查邮箱并完成验证，然后返回此处登录。若未收到邮件，请检查 Supabase 的邮件验证设置。";}
   }else{toast("登录成功");closeModal();await refresh();}
 }catch(e){feedback.textContent="请求失败："+(e?.message||String(e));}
 finally{buttons.forEach(b=>b.disabled=false)}
}

async function myProposals(){

 const items=r.data||[];
 const statusInfo={pending:["待审核","pending"],approved:["已通过","approved"],rejected:["已驳回","rejected"]};
 host.innerHTML=items.length?`<div class="posts-heading"><div><h3>投稿记录</h3><p>共 ${items.length} 条记录，点击卡片可查看提交内容</p></div><span class="posts-total">${items.length} 条</span></div><div class="posts-list">${items.map(p=>{
   const payload=p.payload||{}, st=statusInfo[p.status]||[p.status||"未知状态","unknown"];
   const date=p.created_at?new Date(p.created_at).toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"提交时间未知";
   const note=p.admin_note?`<div class="post-note"><b>审核备注</b><span>${esc(p.admin_note)}</span></div>`:"";
   return `<article class="post-card"><div class="post-card-top"><span class="post-kind"><span class="post-kind-icon">${p.action==="add_cut"?"✂":"▣"}</span>${esc(proposalActionName(p.action))}</span><span class="post-status ${st[1]}"><i></i>${esc(st[0])}</span></div><h4>${esc(payload.title||"未命名番剧")}</h4><div class="post-meta"><span>◷ ${esc(date)}</span>${payload.year?`<span>${esc(payload.year)} 年</span>`:""}${payload.season?`<span>${esc(payload.season)}</span>`:""}${payload.episode?`<span>第 ${esc(payload.episode)} 集</span>`:""}</div>${payload.time_point?`<div class="post-detail"><b>时间点</b><span>${esc(payload.time_point)}</span></div>`:""}${payload.description||payload.cut_description?`<div class="post-description">${esc(payload.description||payload.cut_description)}</div>`:""}${note}<details class="post-more"><summary>查看提交详情</summary>${proposalSummary(payload)}</details></article>`;
 }).join("")}</div>`:`<div class="posts-empty"><div class="posts-empty-icon">✉</div><b>还没有投稿记录</b><p>提交番剧或删减记录后，会在这里显示审核进度。</p><button class="btn primary" type="button" onclick="navigatePage('submit')">＋ 去投稿</button></div>`;
}
function proposalActionName(action){return action==="add_cut"?"新增删减记录":action==="create_anime"?"新增番剧":action||"投稿"}
function proposalSummary(payload={}){
 const rows=[
  ["年份",payload.year],["季度",payload.season],["分类",payload.category],
  ["集数",payload.episode],["删减时间",payload.time_point],["删减概况",payload.cut_description],["删减来源",payload.cut_source_note],["说明/简介",payload.description],
  ["封面",payload.cover_url],["来源",payload.source_note]
 ].filter(([k,v])=>v!==null&&v!==undefined&&String(v).trim()!=="");
 const cuts=Array.isArray(payload.cuts)?payload.cuts:[];
 const cutRows=cuts.map((c,i)=>`<div class="proposal-field"><span>时间点 ${i+1}</span><span>第 ${esc(c.episode||"?")} 集 · ${esc(c.time_point||"未填写")}<br>${esc(c.description||"未填写类型")}</span></div>`).join("");
 return `<div class="proposal-summary"><div class="proposal-title">${esc(payload.title||"未命名番剧")}</div>${rows.map(([k,v])=>`<div class="proposal-field"><span>${esc(k)}</span><span>${esc(String(v))}</span></div>`).join("")}${cutRows?`<div class="proposal-field"><span>多条记录</span><span>${cuts.length} 个时间点</span></div>${cutRows}`:""}</div>`;
}
async function adminReview(){if(!isAdmin){toast("当前账号不是管理员");return}const r=await db.from("proposals").select("*").eq("status","pending").order("created_at");if(r.error){toast(r.error.message);return}const pending=r.data||[];const bulkBar=pending.length?`<div class="item" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f1f6ff"><div><b>批量审核</b><div class="muted" style="font-size:13px">当前有 ${pending.length} 条待审核投稿。批量同意前请确认内容与删减记录正确。</div></div><button class="btn primary" id="approveAllBtn" onclick="batchApproveAll()">✓ 一键同意全部（${pending.length}）</button></div>`:"";modal("待审核投稿","核对内容后再批准。新增删减记录必须对应已收录的番剧。",bulkBar+pending.map(p=>`<div class="item"><b>${esc(proposalActionName(p.action))}</b>${proposalSummary(p.payload||{})}<input class="field" id="note-${p.id}" placeholder="审核备注（选填）"><div class="row"><button class="btn plain" onclick="review('${p.id}','reject')">驳回</button><button class="btn primary" onclick="review('${p.id}','approve')">批准并发布</button></div></div>`).join("")||'<p>当前没有待审核投稿。</p>')}
async function batchApproveAll(){
 if(!isAdmin){toast("当前账号不是管理员");return}
 const r=await db.from("proposals").select("id,action,payload").eq("status","pending").order("created_at");
 if(r.error){toast("读取待审核列表失败："+r.error.message);return}
 const pending=r.data||[];if(!pending.length){toast("当前没有待审核投稿");await adminReview();return}
 if(!confirm(`确定一键同意全部 ${pending.length} 条待审核投稿吗？这会把投稿发布到正式档案，请确认内容正确。`))return;
 const btn=$("approveAllBtn");if(btn){btn.disabled=true;btn.textContent="正在批量处理…"}
 let approved=0;const failures=[];
 for(let i=0;i<pending.length;i++){
  const p=pending[i];
  try{
   const result=await db.rpc("review_proposal",{p_proposal_id:p.id,p_decision:"approve",p_admin_note:"管理员批量审核通过"});
   if(result.error){failures.push(`${p.payload?.title||p.id}：${result.error.message}`);continue}
   await syncApprovedProposal(p.id);approved++;
   if(btn)btn.textContent=`正在处理 ${i+1}/${pending.length}…`;
  }catch(err){failures.push(`${p.payload?.title||p.id}：${err?.message||String(err)}`)}
 }
 await refresh();await adminReview();
 if(failures.length){const nl=String.fromCharCode(10);alert(`批量审核完成。成功：${approved} 条；失败：${failures.length} 条。${nl}${nl}失败详情：${nl}${failures.slice(0,12).join(nl)}${failures.length>12?nl+"其余失败项请在审核列表逐条检查。":""}`)}
 else toast(`批量审核完成：已同意 ${approved} 条投稿`);
}
async function syncApprovedProposal(proposalId){
 const q=await db.from("proposals").select("*").eq("id",proposalId).maybeSingle();if(q.error||!q.data)return;
 const p=q.data,pl=p.payload||{};
 const normalizeCuts=()=>Array.isArray(pl.cuts)&&pl.cuts.length?pl.cuts:[{episode:pl.episode,time_point:pl.time_point,description:pl.cut_description||pl.description,source_note:pl.cut_source_note||pl.source_note||null}];
 async function insertCuts(animeId){
   for(const c of normalizeCuts()){
     const episode=Number(c.episode),timePoint=String(c.time_point||"").trim(),description=String(c.description||"").trim();
     if(!episode||episode<1||!timePoint||!description)continue;
     const existing=await db.from("cut_records").select("id").eq("anime_id",animeId).eq("episode",episode).eq("time_point",timePoint).limit(1);
     if(existing.error)continue;
     if(!existing.data?.length)await db.from("cut_records").insert({anime_id:animeId,episode,time_point:timePoint,description,source_note:c.source_note||pl.source_note||null});
   }
 }
 if(p.action==="create_anime"){
   let aq=await db.from("anime").select("*").ilike("title",String(pl.title||"").trim()).limit(1);if(aq.error||!aq.data?.length)return;
   const a=aq.data[0],fields={};if(pl.cover_url)fields.cover_url=pl.cover_url;if(pl.category)fields.category=pl.category;if(pl.source_note)fields.source_note=pl.source_note;if(pl.description)fields.description=pl.description;
   if(Object.keys(fields).length)await db.from("anime").update(fields).eq("id",a.id);
   await insertCuts(a.id);
 }else if(p.action==="add_cut"&&pl.anime_id){await insertCuts(pl.anime_id)}
}
async function review(id,decision){const note=$("note-"+id)?.value||"";const r=await db.rpc("review_proposal",{p_proposal_id:id,p_decision:decision,p_admin_note:note});if(r.error){const msg=r.error.message||String(r.error);if(msg.includes("正式档案中找不到该番剧")){toast("发布失败：档案里还没有这部番剧。请先新增番剧并审核通过，再提交删减记录。");}else if(msg.includes("管理员")||msg.includes("admin")){toast("审核失败：当前账号没有管理员权限，请检查 profiles.is_admin。");}else{toast("审核失败："+msg);}return}if(decision==="approve")await syncApprovedProposal(id);toast(decision==="approve"?"已批准并同步发布番剧/删减记录":"已驳回");adminReview();refresh()}
window.navigatePage=function(page){
 document.querySelectorAll("[data-page]").forEach(el=>el.classList.toggle("active",el.dataset.page===page));
 const welcome=$("homeWelcome"), layout=$("contentLayout");
 if(welcome)welcome.classList.toggle("page-hidden",page!=="home");
 if(layout){layout.classList.toggle("page-hidden",page==="home"||page==="admin");layout.classList.toggle("page-single",["directory","submit","my-posts"].includes(page));}
 document.querySelectorAll("[data-page-section]").forEach(el=>{
   const section=el.dataset.pageSection;
   el.classList.toggle("page-hidden",!(section===page));
 });
 if(page==="my-posts")myProposals();
 if(page==="admin")adminReview();
 window.scrollTo({top:0,behavior:"smooth"});
};
document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();navigatePage(el.dataset.page)}));
const quickSubmitBtn=$("submitBtn");if(quickSubmitBtn)quickSubmitBtn.onclick=()=>navigatePage("submit");const submitPanelBtn=$("submitPanelBtn"); if(submitPanelBtn) submitPanelBtn.onclick=()=>navigatePage("submit");
const browseDirectoryBtn=$("browseDirectoryBtn"); if(browseDirectoryBtn){browseDirectoryBtn.type="button";browseDirectoryBtn.addEventListener("click",e=>{e.preventDefault();navigatePage("directory");requestAnimationFrame(()=>$("directory")?.scrollIntoView({behavior:"smooth",block:"start"}));});}
$("authBtn").onclick=authDialog;
$("close").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};["search","season","year"].forEach(id=>$(id).addEventListener("input",render));
const searchInput=$("search"),clearSearch=$("clearSearch");
function syncSearchClear(){if(clearSearch)clearSearch.classList.toggle("visible",!!searchInput?.value)}
searchInput?.addEventListener("input",syncSearchClear);
clearSearch?.addEventListener("click",()=>{searchInput.value="";syncSearchClear();render();searchInput.focus()});
const backToTop=$("backToTop");
backToTop?.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
window.addEventListener("scroll",()=>backToTop?.classList.toggle("visible",window.scrollY>280),{passive:true});

const inlineYear = $("newAnimeYear");
if(inlineYear){const now=new Date().getFullYear();for(let y=now;y>=1950;y--){const op=document.createElement("option");op.value=String(y);op.textContent=y+"年";inlineYear.appendChild(op)}}
function existingEpisodeNumbers(){
 const animeId=$("existingAnimeSelect")?.value;
 if(!animeId)return [];
 const nums=new Set();
 cuts.filter(c=>String(c.anime_id)===String(animeId)).forEach(c=>{
  const ep=c.episode??c.episode_number??c.episode_no;
  if(ep!==undefined&&ep!==null&&String(ep).trim()!=="")nums.add(String(ep));
 });
 return [...nums].sort((a,b)=>{const an=Number(a),bn=Number(b);return Number.isFinite(an)&&Number.isFinite(bn)?an-bn:a.localeCompare(b,"zh-CN")});
}
function episodeChoiceMarkup(selected=""){
 const nums=existingEpisodeNumbers();
 const existing=nums.map(ep=>`<option value="${esc(ep)}">第 ${esc(ep)} 集（已有记录）</option>`).join("");
 const options=`<option value="">请选择集数</option>${existing}<option value="__new__">手动新增集数</option>`;
 return options;
}
function makeCutRow(containerId, values={}){
 const container=$(containerId);if(!container)return;
 const card=document.createElement("div");card.className="cut-submit-row";
 const isExisting=containerId==="existingAnimeCuts";
 const episodeValue=values.episode||"";
 let episodeMarkup;
 if(isExisting){
  const known=existingEpisodeNumbers().includes(String(episodeValue));
  const choice=episodeValue?(known?String(episodeValue):"__new__"):"";
  episodeMarkup=`<div class="existing-episode-controls"><div class="episode-select-wrap"><label>选择集数 *</label><select class="field cut-episode-choice">${episodeChoiceMarkup(choice)}</select></div><div class="episode-manual-wrap" ${choice==="__new__"?"":"hidden"}><label>新集数 *</label><input class="field cut-episode-new" type="number" min="1" value="${choice==="__new__"?esc(episodeValue):""}" placeholder="例如 5"></div></div>`;
 }else{
  episodeMarkup=`<div class="cut-episode-head"><div class="episode-input-wrap"><label>集数 *</label><input class="field cut-episode" type="number" min="1" value="${esc(episodeValue)}" placeholder="例如 5"></div></div>`;
 }
 card.innerHTML=`<div class="cut-submit-row-head"><span>记录</span><button class="cut-remove" type="button" data-remove-episode>删除本集</button></div>${episodeMarkup}<div class="cut-time-list"></div><div class="cut-episode-actions"><button class="cut-add-inline" type="button" data-add-time>＋ 添加时间点</button></div>`;
 const list=card.querySelector('.cut-time-list');
 addTimePointRow(list,values.time_point!==undefined||values.description!==undefined?values:{});
 if(isExisting){
  const choiceSelect=card.querySelector('.cut-episode-choice'),manualWrap=card.querySelector('.episode-manual-wrap');
  const requestedEpisode=String(values.episode||"");
  const choiceValue=requestedEpisode?(existingEpisodeNumbers().includes(requestedEpisode)?requestedEpisode:"__new__"):"";
  choiceSelect.value=choiceValue;
  if(manualWrap&&choiceValue==="__new__"&&!card.querySelector(".cut-episode-new").value)card.querySelector(".cut-episode-new").value=requestedEpisode;
  choiceSelect.addEventListener('change',()=>{manualWrap.hidden=choiceSelect.value!=="__new__";if(choiceSelect.value!=="__new__")card.querySelector('.cut-episode-new').value="";});
 }
 card.querySelector('[data-remove-episode]').addEventListener('click',()=>{card.remove();renumberCutRows(containerId)});
 card.querySelector('[data-add-time]').addEventListener('click',()=>addTimePointRow(list));
 container.appendChild(card);renumberCutRows(containerId);
}
function refreshExistingEpisodeOptions(){
 const available=existingEpisodeNumbers();
 document.querySelectorAll('#existingAnimeCuts .cut-submit-row').forEach(card=>{
  const sel=card.querySelector('.cut-episode-choice');if(!sel)return;
  const old=sel.value;
  const opts=`<option value="">请选择集数</option>${available.map(ep=>`<option value="${esc(ep)}">第 ${esc(ep)} 集（已有记录）</option>`).join("")}<option value="__new__">手动新增集数</option>`;
  sel.innerHTML=opts;
  sel.value=available.includes(old)||old==="__new__"?old:"";
  const manual=card.querySelector('.episode-manual-wrap');if(manual)manual.hidden=sel.value!=="__new__";
 });
}

function addTimePointRow(list,values={}){
 const row=document.createElement('div');row.className='cut-time-row';
 row.innerHTML=`<div><label>时间点 *</label><input class="field cut-time" value="${esc(values.time_point||"")}" placeholder="08:24–09:10 或 未知"></div><div><label>类型 / 说明 *</label><textarea class="field cut-description" rows="1" placeholder="字幕和谐、画面删减、对白修改等">${esc(values.description||"")}</textarea></div><button class="cut-remove" type="button" data-remove-time>移除</button>`;
 row.querySelector('[data-remove-time]').addEventListener('click',()=>{if(list.querySelectorAll('.cut-time-row').length<=1)return;row.remove();renumberTimeRows(list)});
 list.appendChild(row);renumberTimeRows(list);
}
function renumberTimeRows(list){const rows=[...list.querySelectorAll('.cut-time-row')];rows.forEach((r,i)=>{const label=r.querySelector('label');if(label)label.textContent=`时间点 ${i+1} *`;const remove=r.querySelector('[data-remove-time]');if(remove)remove.style.display=rows.length>1?'':'none';});}
function renumberCutRows(containerId){const c=$(containerId);if(!c)return;[...c.querySelectorAll('.cut-submit-row')].forEach((r,i)=>{const label=r.querySelector('.cut-submit-row-head span');if(label)label.textContent="记录";r.querySelector('[data-remove-episode]').style.visibility=c.querySelectorAll('.cut-submit-row').length>1?'visible':'hidden';});}
function readCutRows(containerId){const result=[];[...$(containerId).querySelectorAll('.cut-submit-row')].forEach(card=>{let episode=0;if(containerId==="existingAnimeCuts"){const choice=card.querySelector('.cut-episode-choice')?.value||"";episode=choice==="__new__"?Number(card.querySelector('.cut-episode-new')?.value):Number(choice);}else{episode=Number(card.querySelector('.cut-episode')?.value)}card.querySelectorAll('.cut-time-row').forEach(row=>result.push({episode,time_point:row.querySelector('.cut-time').value.trim(),description:row.querySelector('.cut-description').value.trim()}));});return result;}
function collectValidCuts(containerId, optional=false){const rows=readCutRows(containerId),filled=rows.filter(c=>c.episode||c.time_point||c.description);if(optional&&!filled.length)return [];if(filled.some(c=>!c.episode||c.episode<1||!c.time_point||!c.description))throw new Error("每条删减记录都要填写集数、时间点和类型；不需要的空白行可以移除。");return filled;}
function updateSubmissionType(){
 const type=$("submissionType").value,isNew=type==="create_anime";
 $("newAnimeFields").style.display=isNew?"block":"none";$("existingAnimeFields").style.display=isNew?"none":"block";
 ["newAnimeTitle","newAnimeSeason","newAnimeYear","inlineCoverUrl"].forEach(id=>$(id).required=isNew);
 $("existingAnimeSelect").required=!isNew;
 const select=$("existingAnimeSelect"),selected=select.value;
 select.innerHTML='<option value="">请选择番剧</option>'+records.slice().sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"zh-CN")).map(a=>`<option value="${esc(a.id)}">${esc(a.title)}${a.year?`（${esc(a.year)}）`:""}</option>`).join("");if(selected)select.value=selected;
 refreshExistingEpisodeOptions();
 $("submitIntro").textContent=isNew?"新增番剧：填写基本信息，可一次提交多条删减时间点。":"已收录番剧：选择番剧后，可一次添加同一集或不同集数的多个时间点。";
}
function addEpisodeButton(containerId){const container=$(containerId);if(!container)return;const button=document.createElement('button');button.type='button';button.className='cut-add-episode';button.textContent='＋ 添加另一集';button.addEventListener('click',()=>makeCutRow(containerId));container.after(button);}
makeCutRow("newAnimeCuts");makeCutRow("existingAnimeCuts");addEpisodeButton("newAnimeCuts");addEpisodeButton("existingAnimeCuts");
$("submissionType").addEventListener("change",updateSubmissionType);
$("existingAnimeSelect").addEventListener("change",()=>{refreshExistingEpisodeOptions();});
$("inlineProposalForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!db){toast("投稿服务未初始化，请检查 Supabase 配置和网络");return}if(!currentUser){toast("请先登录后再投稿");authDialog();return}
 const form=e.currentTarget,submit=$("inlineSubmitButton"),type=$("submissionType").value;let action,payload;
 try{
  if(type==="create_anime"){
   const title=$("newAnimeTitle").value.trim(),season=$("newAnimeSeason").value,year=$("newAnimeYear").value,cover=$("inlineCoverUrl").value.trim();
   if(!title||!season||!year||!cover){toast("请填写番剧名称、季度、年份和封面图片 URL");return}
   const cuts=collectValidCuts("newAnimeCuts",true);
   payload={title,year:Number(year),season,category:$("newAnimeCategory").value||"TV动画",cover_url:cover,cuts};
   if(cuts.length)Object.assign(payload,{episode:cuts[0].episode,time_point:cuts[0].time_point,cut_description:cuts[0].description});
   action="create_anime";
  }else{
   const anime=records.find(a=>a.id===$("existingAnimeSelect").value);if(!anime){toast("请先选择一部已收录番剧");return}
   const cuts=collectValidCuts("existingAnimeCuts",false);if(!cuts.length){toast("请至少添加一条删减时间点");return}
   payload={title:anime.title,anime_id:anime.id,year:anime.year??null,season:anime.season??null,cuts};
   if(cuts.length)Object.assign(payload,cuts[0]);action="add_cut";
  }
 }catch(err){toast(err.message||String(err));return}
 submit.disabled=true;submit.textContent=isAdmin?"正在发布……":"正在提交……";
 try{
  const inserted=await db.from("proposals").insert({user_id:currentUser.id,action,payload,status:"pending"}).select("id").single();
  if(inserted.error){toast("投稿失败："+inserted.error.message);return}
  if(isAdmin){const reviewed=await db.rpc("review_proposal",{p_proposal_id:inserted.data.id,p_decision:"approve",p_admin_note:"管理员投稿，自动发布"});if(reviewed.error){toast("投稿已保存，但直接发布失败："+reviewed.error.message+"。请到审核列表完成发布。");return}await syncApprovedProposal(inserted.data.id);toast("管理员投稿成功，已直接发布");}
  else toast("投稿成功，已提交管理员审核");
  form.reset();$("newAnimeCuts").innerHTML="";$("existingAnimeCuts").innerHTML="";makeCutRow("newAnimeCuts");makeCutRow("existingAnimeCuts");updateSubmissionType();await refresh();
 }catch(err){toast("投稿请求失败："+(err?.message||String(err)))}finally{submit.disabled=false;submit.textContent="➤ 提交投稿"}
});
navigatePage("home");
if(db){db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh()}else refresh();
</script></body></html>
