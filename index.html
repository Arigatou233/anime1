<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>番剧档案馆 · 云端版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f8fc;--paper:#fff;--ink:#20243a;--muted:#737991;--line:#e7e9f2;--brand:#6558d9;--soft:#f0eeff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1080px,calc(100% - 28px));margin:auto}.top{background:#ffffffed;border-bottom:1px solid var(--line);padding:16px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:19px}.mark{display:inline-grid;place-items:center;background:var(--brand);color:white;width:38px;height:38px;border-radius:12px;margin-right:8px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.plain{background:#fff;border:1px solid var(--line);color:var(--ink)}.hero{padding:36px 0 18px}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:8px 0}.muted{color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 10px 28px #20204008}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.filters{display:grid;grid-template-columns:1fr 160px 140px;gap:10px;margin-top:12px}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfcff;font:inherit}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.cover{height:100px;border-radius:12px;background:linear-gradient(135deg,#eeedff,#e5f3ff);display:grid;place-items:center;font-size:38px;margin-bottom:12px}.card h3{margin:0 0 4px}.pill{display:inline-block;padding:3px 8px;background:var(--soft);color:var(--brand);border-radius:8px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#17172b88;z-index:5;padding:16px;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{background:white;border-radius:18px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.notice{padding:12px;border-radius:12px;background:#f5f3ff;color:#5548ae;margin:10px 0}.item{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#22243b;color:white;border-radius:10px;padding:10px 14px;display:none;max-width:90vw;z-index:10}.toast.show{display:block}footer{text-align:center;padding:28px;color:var(--muted);font-size:12px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}@media(max-width:460px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.nav{align-items:flex-start}.brand{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand"><span class="mark">映</span>番剧档案馆 <small class="muted">云端版</small></div><div><button class="btn plain" id="authBtn">登录 / 注册</button> <button class="btn primary" id="submitBtn">＋ 投稿</button></div></div></header>
<main class="wrap">
<section class="hero"><div class="muted">ANIME CUT ARCHIVE</div><h1>把每一处删减，<br>都记录下来。</h1><p class="muted">公开浏览 · 登录投稿 · 管理员审核后发布</p><div id="status" class="notice">正在连接云端……</div></section>
<section class="stats"><div class="stat"><b id="animeCount">—</b><span class="muted">收录番剧</span></div><div class="stat"><b id="cutCount">—</b><span class="muted">删减记录</span></div><div class="stat"><b id="userState">访客</b><span class="muted">当前状态</span></div></section>
<section class="panel"><h2>档案目录</h2><div class="filters"><input class="field" id="search" placeholder="搜索番剧名称…"><select class="field" id="season"><option value="">全部季度</option><option>冬季</option><option>春季</option><option>夏季</option><option>秋季</option></select><select class="field" id="year"><option value="">全部年份</option></select></div></section>
<section id="cards" class="cards"></section>
<section class="panel"><h2>我的投稿</h2><p class="muted">登录后可查看自己的待审核投稿。</p><button class="btn plain" id="myPropsBtn">查看我的投稿</button> <button class="btn plain" id="adminBtn" style="display:none">管理员审核</button><div id="myProps"></div></section>
</main><footer>番剧档案馆 · GitHub Pages + Supabase</footer>
<div class="modal" id="modal"><div class="dialog"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 id="modalTitle" style="margin:0">窗口</h2><p class="muted" id="modalDesc"></p></div><button class="btn plain" id="close">关闭</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
/* 填入你的 Supabase Project URL 与 Publishable key。不要填写 Secret/service_role key。 */
const SUPABASE_URL = "https://zmrrygvatvcxlegycydw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_9AVSujXZOvBGwVK6DoSvOA__GjsnX4S";
const configured = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");
const db = configured ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY) : null;
let currentUser=null, isAdmin=false, records=[], cuts=[];
const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),3000)}
function modal(title,desc,body){$("modalTitle").textContent=title;$("modalDesc").textContent=desc||"";$("modalBody").innerHTML=body;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function refresh(){
 if(!db){$("status").textContent="尚未配置 Supabase。请在 index.html 中填写 Project URL 和 Publishable key。";return}
 const {data:sessionData}=await db.auth.getSession();currentUser=sessionData.session?.user||null;
 if(currentUser){const p=await db.from("profiles").select("is_admin").eq("id",currentUser.id).maybeSingle();isAdmin=!!p.data?.is_admin}
 else isAdmin=false;
 $("userState").textContent=currentUser?(isAdmin?"管理员":"已登录"):"访客";$("authBtn").textContent=currentUser?"退出登录":"登录 / 注册";$("adminBtn").style.display=isAdmin?"inline-block":"none";
 const a=await db.from("anime").select("*").order("title");
 if(a.error){$("status").textContent="读取番剧失败："+a.error.message+"。请检查 schema.sql 与 RLS 策略。";return}
 records=a.data||[];
 const c=await db.from("cut_records").select("*").order("episode");cuts=c.data||[];
 if(c.error){$("status").textContent="读取删减记录失败："+c.error.message;return}
 $("status").textContent="云端已连接 · 数据来自 Supabase";$("animeCount").textContent=records.length;$("cutCount").textContent=cuts.length;
 const years=[...new Set(records.map(x=>x.year).filter(Boolean))].sort((a,b)=>b-a), old=$("year").value;
 $("year").innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${y}">${y} 年</option>`).join("");$("year").value=old;
 render();
}
function render(){const q=$("search").value.trim().toLowerCase(),s=$("season").value,y=$("year").value;
 const list=records.filter(a=>(!q||String(a.title||"").toLowerCase().includes(q))&&(!s||a.season===s)&&(!y||String(a.year)===y));
 $("cards").innerHTML=list.length?list.map(a=>{let cs=cuts.filter(c=>c.anime_id===a.id);return `<article class="card"><div class="cover">🎞️</div><h3>${esc(a.title)}</h3><div class="muted">${esc(a.year||"年份待补")} · ${esc(a.season||"季度待补")}</div><p><span class="pill">${cs.length} 条删减记录</span></p><button class="btn plain" onclick="showDetail('${a.id}')">查看详情</button></article>`}).join(""):'<div class="panel" style="grid-column:1/-1">暂无符合条件的公开番剧记录。</div>'}
function showDetail(id){const a=records.find(x=>x.id===id),cs=cuts.filter(c=>c.anime_id===id);modal(a.title,`${a.year||""} ${a.season||""}`,cs.length?cs.map(c=>`<div class="item"><b>第 ${esc(c.episode)} 集 · ${esc(c.time_point)}</b><p>${esc(c.description)}</p><small class="muted">${esc(c.source_note||"")}</small></div>`).join(""):'<p class="muted">暂未收录删减时间点。</p>')}
function authDialog(){if(currentUser){db.auth.signOut().then(()=>{toast("已退出登录");refresh()});return}modal("登录 / 注册","使用邮箱创建账号或登录",`<form id="authForm"><label>邮箱</label><input class="field" name="email" type="email" required><p><label>密码（至少 6 位）</label><input class="field" name="password" type="password" minlength="6" required></p><div class="row"><button class="btn plain" type="button" onclick="authSubmit('signup')">注册</button><button class="btn primary" type="button" onclick="authSubmit('signin')">登录</button></div></form>`)}
async function authSubmit(mode){const f=$("authForm"),email=f.email.value,password=f.password.value;let r=mode==="signup"?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error){toast(r.error.message);return}if(mode==="signup"&&r.data.user){const ins=await db.from("profiles").upsert({id:r.data.user.id,display_name:email.split("@")[0],is_admin:false});if(ins.error)toast("账号已创建，但资料初始化失败："+ins.error.message);else toast("注册成功，请按邮箱验证提示完成验证（如已开启验证）")}else toast("登录成功");closeModal();refresh()}
function proposalDialog(){if(!currentUser){toast("请先登录后再投稿");authDialog();return}modal("提交审核申请","内容不会立即公开，需管理员批准后合并",`<form id="proposalForm" class="grid"><div class="full"><label>申请类型</label><select class="field" name="action"><option value="create_anime">新增番剧</option><option value="add_cut">为已有番剧新增删减记录</option></select></div><div class="full"><label>番剧名称</label><input class="field" name="title" required placeholder="准确的番剧名称"></div><div><label>年份</label><input class="field" name="year" type="number" min="1950" max="2100"></div><div><label>季度</label><select class="field" name="season"><option value="">请选择</option><option>冬季</option><option>春季</option><option>夏季</option><option>秋季</option></select></div><div><label>集数（新增删减记录时填写）</label><input class="field" name="episode" type="number" min="1"></div><div><label>时间点（例如 08:24）</label><input class="field" name="time_point" placeholder="08:24"></div><div class="full"><label>删减说明 / 简介</label><textarea class="field" name="description" rows="3" required></textarea></div><div class="full"><label>来源或版本备注</label><input class="field" name="source_note"></div><div class="full"><button class="btn primary" type="submit">提交待审核</button></div></form>`);
 $("proposalForm").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const payload={title:d.title.trim(),year:d.year?Number(d.year):null,season:d.season||null,episode:d.episode?Number(d.episode):null,time_point:d.time_point.trim(),description:d.description.trim(),source_note:d.source_note.trim()};
 if(d.action==="add_cut"&&(!payload.episode||!payload.time_point)){toast("新增删减记录需要填写集数和时间点");return}
 const r=await db.from("proposals").insert({user_id:currentUser.id,action:d.action,payload,status:"pending"});if(r.error){toast("投稿失败："+r.error.message);return}closeModal();toast("已提交，等待管理员审核");};
}
async function myProposals(){if(!currentUser){toast("请先登录");authDialog();return}const r=await db.from("proposals").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});$("myProps").innerHTML=r.error?esc(r.error.message):(r.data||[]).map(p=>`<div class="item"><b>${esc(p.action)}</b> · ${esc(p.status)}<p>${esc(p.payload?.title||"")}</p><small class="muted">${esc(p.admin_note||"")}</small></div>`).join("")||'<p class="muted">还没有投稿。</p>'}
async function adminReview(){if(!isAdmin){toast("当前账号不是管理员");return}const r=await db.from("proposals").select("*").eq("status","pending").order("created_at");if(r.error){toast(r.error.message);return}modal("待审核投稿","批准会调用数据库函数，将投稿合并到正式档案。",(r.data||[]).map(p=>`<div class="item"><b>${esc(p.payload?.title||"未命名")} · ${esc(p.action)}</b><p>${esc(JSON.stringify(p.payload))}</p><input class="field" id="note-${p.id}" placeholder="审核备注（选填）"><div class="row"><button class="btn plain" onclick="review('${p.id}','reject')">驳回</button><button class="btn primary" onclick="review('${p.id}','approve')">批准并发布</button></div></div>`).join("")||'<p>当前没有待审核投稿。</p>')}
async function review(id,decision){const note=$("note-"+id)?.value||"";const r=await db.rpc("review_proposal",{p_proposal_id:id,p_decision:decision,p_admin_note:note});if(r.error){toast("审核失败："+r.error.message+"；请先执行 cloud_setup.sql 并确认当前账号已设为管理员");return}toast(decision==="approve"?"已批准并发布":"已驳回");adminReview();refresh()}
$("authBtn").onclick=authDialog;$("submitBtn").onclick=proposalDialog;$("myPropsBtn").onclick=myProposals;$("adminBtn").onclick=adminReview;$("close").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};["search","season","year"].forEach(id=>$(id).addEventListener("input",render));
if(db){db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh()}else refresh();
</script></body></html>
