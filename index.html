/* Reference screenshot layout override */
:root{--bg:#f2f7ff;--paper:rgba(255,255,255,.94);--ink:#142b5b;--muted:#7d8eac;--line:#e1eaf7;--brand:#4d80f5;--soft:#edf4ff;--shadow:0 5px 20px rgba(57,93,157,.08)}
body{background:linear-gradient(180deg,#d9eaff 0,#f2f7ff 340px,#f4f8ff 100%);color:var(--ink)}
body:before{background:radial-gradient(ellipse at 10% 12%,#fff 0 5%,transparent 22%),radial-gradient(ellipse at 35% 20%,#fff 0 5%,transparent 22%),radial-gradient(ellipse at 85% 13%,#fff 0 7%,transparent 24%),linear-gradient(155deg,#c9e2ff,#edf6ff 45%,#f9fbff)}
.wrap{width:min(1500px,calc(100% - 42px))}
.top{padding:7px 0;background:rgba(255,255,255,.86)}
.nav{gap:10px}.brand{font-size:25px;min-width:max-content}.mark{width:48px;height:48px;border-radius:50%}
.navlinks{gap:3px;justify-content:center}.navlinks a{font-size:14px;padding:10px 11px;border-radius:0;white-space:nowrap}
.navlinks a.active{background:transparent;border-bottom:3px solid #4d80f5}
.user-chip{padding:5px 9px;border-radius:13px}.user-chip img{width:30px;height:30px}
.hero{height:232px;min-height:232px;padding:54px 0 25px;background-image:linear-gradient(90deg,rgba(223,239,255,.1),rgba(220,236,255,.02)),url("banner.png");background-position:center 43%;background-size:cover;border-bottom:1px solid #dceaff}
.hero:before,.hero:after{display:none}.hero .wrap{z-index:2}
.hero h1{font-size:44px;margin:5px 0 2px;letter-spacing:0;color:#142b5b;text-shadow:0 1px 2px #fff8}
.hero p{font-size:17px;color:#415b84;max-width:560px}
.hero .eyebrow{display:none}
.hero-art{display:none}
#status{display:none!important}
.stats{display:none}
.layout{grid-template-columns:minmax(0,2.2fr) minmax(350px,.92fr);gap:14px;margin-top:-1px;align-items:start}
.panel{border-radius:15px;padding:18px;margin-bottom:12px;box-shadow:0 4px 18px rgba(65,100,160,.07)}
.panel h2{font-size:19px}
#directory{margin-bottom:10px}
#directory h2{margin-bottom:7px}
.filters{grid-template-columns:minmax(160px,1fr) 150px 130px;margin-top:8px}
#cards{display:flex;flex-direction:column;gap:0}

#cards .season-group{margin:0 0 14px;border:1px solid #dfe9fa;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.58)}
#cards .season-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:12px 15px;background:linear-gradient(90deg,#eaf2ff,#f7faff);color:#294778;font-size:15px;border-bottom:1px solid #e0eaf8}
#cards .season-count{font-size:12px;font-weight:600;color:#7186aa;background:#fff;padding:4px 9px;border-radius:999px;white-space:nowrap}
#cards .season-group .card:last-child{border-bottom:0}

#cards .card{display:grid;grid-template-columns:105px minmax(180px,1fr) minmax(200px,.9fr);gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid #eaf0f8;border-radius:0;background:rgba(255,255,255,.72);box-shadow:none;min-height:128px}
#cards .card:hover{transform:none;background:#fff}
#cards .cover{height:100px;width:104px;margin:0;border-radius:9px}
#cards .card h3{font-size:17px;margin:0 0 7px}
#cards .card p{margin:5px 0}
#cards .card .detail-side{min-width:0;border-left:1px solid #e6edf7;padding-left:12px}
#cards .card .detail-side{display:none!important}
#cards .card .muted{font-size:12px;color:#8999b2}
#cards .card .pill{font-size:12px}
#submit{position:sticky;top:86px;padding:18px 20px}
#submit h2{font-size:20px;margin-bottom:6px}
#submit .muted{font-size:13px}
#submitPanelBtn{margin-top:10px}
#my-posts{margin-top:12px}
footer{padding:18px 12px;text-align:center}
@media(max-width:1050px){
 .wrap{width:calc(100% - 24px)}.nav{flex-wrap:wrap}.navlinks{order:3;width:100%;justify-content:center}
 .layout{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr)}
 #cards .card{grid-template-columns:85px minmax(140px,1fr)}#cards .cover{width:85px;height:95px}

}

 .brand{font-size:19px}.mark{width:40px;height:40px}.user-chip{margin-left:auto}
}
@media(max-width:460px){
 .navlinks a{font-size:12px;padding:7px 6px}.user-chip{gap:4px}.user-chip .btn{padding:7px 8px;font-size:12px}

}


.inline-form{display:flex;flex-direction:column;gap:7px}
.inline-form label{font-size:13px;font-weight:750;margin-top:3px;color:#354d78}
.inline-form .field{padding:9px 11px;font-size:13px}
.inline-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#submit .notice{font-size:12px}


/* Final requested fixes */
.hero{height:232px;min-height:232px;padding:0;background-image:url("banner.png");background-size:cover;background-position:center 48%}
.hero>.wrap,.hero-art{display:none!important}
.hero:before,.hero:after{display:none!important}
.user-chip img{display:none!important}
.default-avatar{width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;background:#edf3ff;color:#6e88b8;font-size:13px;font-weight:800;flex:0 0 30px}.default-avatar.visible{display:inline-flex}

.page-hidden{display:none!important}
.layout.page-single{grid-template-columns:minmax(0,1fr)!important}

.proposal-summary{margin:10px 0 12px;padding:12px 13px;border-radius:12px;background:#f3f7ff;border:1px solid #e2ebfb;overflow-wrap:anywhere}.proposal-title{font-size:17px;font-weight:800;margin-bottom:7px;color:#173365}.proposal-field{display:grid;grid-template-columns:76px minmax(0,1fr);gap:9px;padding:5px 0;border-top:1px solid #e4ecfa;font-size:13px;line-height:1.5}.proposal-field span:first-child{color:#7b8fb3}.proposal-field span:last-child{color:#263e6b;white-space:pre-wrap}.proposal-field a{overflow-wrap:anywhere}@media(max-width:560px){.proposal-field{grid-template-columns:62px minmax(0,1fr)}}

/* My submissions: cleaner archive-style cards */
#my-posts>h2{display:flex;align-items:center;gap:10px;margin-bottom:5px}

#my-posts>p.muted{margin:0 0 15px;color:#7d8eac}
#my-posts>#myPropsBtn,#my-posts>#adminBtn{margin:0 6px 15px 0}
.posts-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 12px;padding:14px 16px;border:1px solid #e2ebfa;border-radius:14px;background:linear-gradient(110deg,#f2f7ff,#fff)}
.posts-heading h3{margin:0;color:#203b6d;font-size:17px}.posts-heading p{margin:2px 0 0;color:#8797b2;font-size:12px}.posts-total{flex-shrink:0;padding:5px 11px;border-radius:99px;background:#e6efff;color:#4777df;font-weight:800;font-size:12px}

.post-card{min-width:0;padding:16px;border:1px solid #e0eafa;border-radius:16px;background:linear-gradient(145deg,#fff 0%,#f9fbff 100%);box-shadow:0 5px 18px rgba(61,99,163,.055);transition:transform .18s,box-shadow .18s}
.post-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(61,99,163,.1)}
.post-card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.post-kind{display:inline-flex;align-items:center;gap:7px;color:#526b96;font-size:12px;font-weight:750}.post-kind-icon{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:#eaf1ff;color:#4b7cf2;font-size:15px}
.post-status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap}.post-status i{width:6px;height:6px;border-radius:50%;background:currentColor}.post-status.pending{color:#b7791f;background:#fff4db}.post-status.approved{color:#25845c;background:#e5f8ef}.post-status.rejected{color:#c24c62;background:#fff0f2}.post-status.unknown{color:#64748b;background:#eef2f7}
.post-card h4{font-size:18px;line-height:1.4;margin:12px 0 8px;color:#1c3564;overflow-wrap:anywhere}.post-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.post-meta span{font-size:11px;color:#7184a5;background:#f0f5ff;border:1px solid #e6edfa;padding:3px 8px;border-radius:7px}.post-detail{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:9px 11px;border-radius:10px;background:#f0f6ff;font-size:13px}.post-detail b{flex-shrink:0;color:#6d83a8}.post-detail span{color:#294675;overflow-wrap:anywhere}.post-description{color:#526887;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.post-note{display:flex;gap:8px;margin-top:10px;padding:9px 10px;background:#fff8e8;border:1px solid #f6e8c4;border-radius:10px;font-size:12px;color:#896b2b}.post-note b{flex-shrink:0}.post-note span{overflow-wrap:anywhere}.post-more{margin-top:12px;border-top:1px solid #eaf0fa;padding-top:10px}.post-more summary{cursor:pointer;color:#4d78d5;font-size:12px;font-weight:750;list-style:none}.post-more summary:after{content:"＋";float:right}.post-more[open] summary:after{content:"－"}.post-more .proposal-summary{margin-top:10px}

<body>
<header class="top"><div class="wrap nav"><div class="brand"><img class="mark" src="avatar.jpeg" alt="番剧档案馆头像">番剧档案馆</div><nav class="navlinks"><a href="#" class="active" data-page="home">⌂ 首页</a><a href="#" data-page="directory">⌕ 番剧列表</a><a href="#" data-page="submit">＋ 提交投稿</a><a href="#" data-page="my-posts">♟ 我的投稿</a><a href="#" id="navAdmin" data-page="admin" style="display:none">♢ 审核列表</a></nav><div class="user-chip"><span class="default-avatar" id="roleBadge" aria-label="账号身份"></span><button class="btn plain" id="authBtn" type="button">登录 / 注册</button><button class="btn primary" id="submitBtn" type="button">＋ 投稿</button></div></div></header>
<section class="hero" id="home"><div class="wrap"><div class="eyebrow">ANIME CUT ARCHIVE</div><h1>番剧档案馆</h1><p>记录每一部番剧的删减 · 让喜欢的作品更完整</p><div id="status" class="notice">正在连接云端……</div></div><img class="hero-art" src="avatar.jpeg" alt="银发眼镜动漫女孩"></section>
<main class="wrap"><section class="stats"><div class="stat"><b id="animeCount">—</b><span class="muted">收录番剧</span></div><div class="stat"><b id="cutCount">—</b><span class="muted">删减记录</span></div><div class="stat"><b id="userState">访客</b><span class="muted">当前状态</span></div></section><section class="panel page-section" id="homeWelcome" data-page-section="home"><h2>欢迎来到番剧档案馆</h2><p class="muted">记录每一部番剧的删减 · 让喜欢的作品更完整。</p><button class="btn primary" type="button" id="browseDirectoryBtn">浏览番剧列表</button></section><div class="layout page-hidden" id="contentLayout"><div><section class="panel page-section page-hidden" id="directory" data-page-section="directory"><h2>番剧列表</h2><div class="filters"><input class="field" id="search" placeholder="搜索番剧名称…"><select class="field" id="season"><option value="">全部季度</option><option>春季</option><option>夏季</option><option>秋季</option><option>冬季</option></select><select class="field" id="year"><option value="">全部年份</option></select></div></section><section id="cards" class="cards page-section page-hidden" data-page-section="directory"></section><section class="panel page-section page-hidden" id="my-posts" data-page-section="my-posts"><h2>我的投稿</h2><p class="muted">登录后可查看自己的待审核投稿。</p><button class="btn plain" id="myPropsBtn">查看我的投稿</button> <button class="btn plain" id="adminBtn" style="display:none">审核列表</button><div id="myProps"></div></section></div><aside class="panel page-section page-hidden" id="submit" data-page-section="submit"><h2>🔵 提交投稿</h2><p class="muted" id="submitIntro">选择投稿类型：新增番剧，或给已收录番剧补充删减记录。</p>
<form id="inlineProposalForm" class="inline-form">

<div id="newAnimeFields">

<script>

async function refresh(){
 if(!db){$("status").textContent="Supabase 未加载或配置无效。请检查网络、Supabase URL 和 Publishable key。";$ ("authBtn").disabled=false;return}

 else isAdmin=false;
 $("userState").textContent=currentUser?(isAdmin?"管理员":"已登录"):"访客";const roleBadge=$("roleBadge");if(roleBadge){roleBadge.textContent=isAdmin?"管":"客";roleBadge.classList.toggle("visible",!!currentUser);roleBadge.title=isAdmin?"管理员":"游客";}$("authBtn").textContent=currentUser?"退出登录":"登录 / 注册";$("adminBtn").style.display=isAdmin?"inline-block":"none";if($("navAdmin"))$("navAdmin").style.display=isAdmin?"inline-block":"none";
 const a=await db.from("anime").select("*").order("title");

 records=a.data||[];

 if(c.error){$("status").textContent="读取删减记录失败："+c.error.message;return}
 $("status").textContent="云端已连接 · 数据来自 Supabase";$("animeCount").textContent=records.length;$("cutCount").textContent=cuts.length;
 const years=[...new Set(records.map(x=>x.year).filter(Boolean))].sort((a,b)=>b-a), old=$("year").value;

function render(){
 const q=$("search").value.trim().toLowerCase(),s=$("season").value,y=$("year").value;
 const seasonOrder={"春季":0,"夏季":1,"秋季":2,"冬季":3};
 const list=records.filter(a=>(!q||String(a.title||"").toLowerCase().includes(q))&&(!s||a.season===s)&&(!y||String(a.year)===y));
 // 按年份从新到旧；同一年按春、夏、秋、冬排列，未填写信息的番剧放在最后。
 list.sort((a,b)=>{
   const ay=Number(a.year)||0,by=Number(b.year)||0;
   if(ay!==by)return by-ay;
   const as=seasonOrder[a.season]??99,bs=seasonOrder[b.season]??99;
   if(as!==bs)return as-bs;
   return String(a.title||"").localeCompare(String(b.title||""),"zh-CN");
 });
 const cardHtml=a=>{let cs=cuts.filter(c=>String(c.anime_id)===String(a.id));const coverUrl=a.cover_url||a.cover_image_url||a.cover_image||a.poster_url||a.image_url||a.cover||"";return `<article class="card"><div class="cover">${coverUrl?`<img src="${esc(coverUrl)}" alt="${esc(a.title)} 封面" loading="lazy" onerror="this.parentElement.textContent='🎞️'">`:'🎞️<small>暂无封面</small>'}</div><div class="card-main"><h3>${esc(a.title)}</h3><div class="muted"><span class="pill">${esc(a.category||"TV动画")}</span>　<span class="pill">${esc(a.season||"季度待补")}</span>　${esc(a.year||"年份待补")}年</div><p><span class="pill">${cs.length} 条删减记录</span></p><button class="btn plain" onclick="showDetail('${a.id}')">查看详情 ↗</button>${isAdmin?` <button class="btn plain" onclick="editAnime('${a.id}')">编辑</button> <button class="btn plain" style="color:#c43d52" onclick="deleteAnime('${a.id}')">删除</button>`:""}</div></article>`};
 if(!list.length){$("cards").innerHTML='<div class="panel" style="grid-column:1/-1">暂无符合条件的公开番剧记录。</div>';return;}
 const groups=new Map();
 list.forEach(a=>{const year=a.year?`${a.year} 年`:`年份待补`,season=a.season||"季度待补",key=`${year}｜${season}`;if(!groups.has(key))groups.set(key,{year:a.year,season,items:[]});groups.get(key).items.push(a);});
 $("cards").innerHTML=[...groups.values()].map(g=>`<section class="season-group"><h3 class="season-heading"><span>📅 ${esc(g.year||"年份待补")} · ${esc(g.season)}</span><span class="season-count">${g.items.length} 部</span></h3>${g.items.map(cardHtml).join("")}</section>`).join("");
}

 modal("修改已发布番剧","只修改番剧名称、年份、季度、分类和封面。",`<form id="editAnimeForm" class="grid">
 <div class="full"><label>番剧名称 *</label><input class="field" name="title" required value="${esc(a.title||"")}"></div>
 <div><label>年份</label><input class="field" name="year" type="number" min="1950" max="2100" value="${esc(a.year||"")}"></div>
 <div><label>季度</label><select class="field" name="season"><option value="">未填写</option>${["春季","夏季","秋季","冬季"].map(x=>`<option value="${x}" ${a.season===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label>分类</label><select class="field" name="category">${["TV动画","剧场版","OVA","ONA","其他"].map(x=>`<option value="${x}" ${((a.category||"TV动画")===x)?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="full"><label>封面图片 URL *</label><input class="field" id="editCoverUrl" name="cover_url" type="url" required value="${esc(coverValue)}" placeholder="粘贴可公开访问的图片直链"><div style="display:flex;align-items:center;gap:12px;margin-top:8px"><img id="editCoverPreview" src="${esc(coverValue)}" alt="封面预览" style="width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #dce7fb;${coverValue?'':'display:none'}" onerror="this.style.display='none'"><small class="muted">封面链接必填；请使用无需登录即可访问的图片直链。</small></div></div>
 <div class="full"><button class="btn primary" type="submit" style="width:100%">保存当前页修改的信息</button></div></form>`);
 const coverInput=$("editCoverUrl"),coverPreview=$("editCoverPreview");coverInput?.addEventListener("input",()=>{const u=coverInput.value.trim();coverPreview.src=u;coverPreview.style.display=u?"block":"none"});
 $("editAnimeForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),title=String(f.get("title")||"").trim(),cover=String(f.get("cover_url")||"").trim();if(!title){toast("番剧名称不能为空");return}if(!cover){toast("封面图片 URL 为必填项");return}
 const saveBtn=e.currentTarget.querySelector('button[type="submit"]');saveBtn.disabled=true;saveBtn.textContent="正在保存…";
 try{const r=await db.rpc("admin_update_anime",{p_anime_id:id,p_title:title,p_year:f.get("year")?Number(f.get("year")):null,p_season:String(f.get("season")||"")||null,p_description:a.description??null});if(r.error){toast("修改失败："+r.error.message);return}
 const extra=await db.from("anime").update({category:String(f.get("category")||"TV动画"),cover_url:cover}).eq("id",id);if(extra.error){toast("名称等信息已保存，但分类或封面更新失败："+extra.error.message);await refresh();return}
 closeModal();toast("番剧信息已保存");await refresh();
 }catch(err){toast("保存失败："+(err?.message||String(err)))}finally{if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="保存当前页修改的信息"}}
 };
};
window.deleteAnime=function(id){
 if(!isAdmin){toast("只有管理员可以删除已发布番剧");return}
 const a=records.find(x=>x.id===id);if(!a)return;
 modal("删除已发布番剧",`确定删除「${esc(a.title)}」吗？此操作会同时删除这部番剧关联的全部删减记录，且无法撤销。`, `<div class="row" style="justify-content:flex-end"><button class="btn plain" onclick="closeModal()">取消</button><button class="btn primary" style="background:#c43d52" id="confirmDeleteAnime">确认删除</button></div>`);

function showDetail(id){
 const a=records.find(x=>String(x.id)===String(id)),cs=cuts.filter(c=>String(c.anime_id)===String(id));
 if(!a){toast("找不到这部番剧");return}

 const cover=coverUrl?`<img src="${esc(coverUrl)}" alt="${esc(a.title)} 封面" loading="lazy" style="width:100px;height:140px;object-fit:cover;border-radius:10px;float:left;margin:0 12px 8px 0" onerror="this.style.display='none'">`:"";
 const intro=`<div>${cover}<p>${esc(a.description||"暂无简介")}</p><div style="clear:both"></div></div>`;
 const cutHtml=cs.length?cs.map(c=>{const ep=c.episode??c.episode_number??c.episode_no??"未填写",tp=c.time_point??c.timepoint??c.cut_time??"未知",desc=c.description??c.cut_description??c.summary??c.overview??c.note??"暂无说明";return `<div class="item"><b>第 ${esc(ep)} 集</b><p><strong>时间点：</strong>${esc(tp)}</p><p><strong>类型：</strong>${esc(desc)}</p>${c.source_note?`<p><a href="${esc(c.source_note)}" target="_blank" rel="noopener">查看来源链接 ↗</a></p>`:""}${isAdmin?`<button class="btn plain" onclick="editCutRecord('${c.id}')">编辑这条记录</button>`:""}</div>`}).join(""):'<p class="muted">暂未收录删减记录。</p>';
 modal(a.title,`${a.year||""} ${a.season||""}`,intro+cutHtml)

window.editCutRecord=function(id){
 if(!isAdmin){toast("只有管理员可以修改已发布删减记录");return}
 const c=cuts.find(x=>String(x.id)===String(id));if(!c){toast("找不到这条删减记录");return}
 const ep=c.episode??c.episode_number??c.episode_no??"",tp=c.time_point??c.timepoint??c.cut_time??"",desc=c.description??c.cut_description??c.summary??c.overview??c.note??"",source=c.source_note??"";
 modal("编辑删减记录","可修改集数、时间点和类型。保存后直接更新公开记录。",`<form id="editCutForm"><label>集数 *</label><input class="field" name="episode" type="number" min="1" required value="${esc(ep)}"><label>时间点 *</label><input class="field" name="time_point" required value="${esc(tp)}" placeholder="例如 08:24–09:10；不确定可填未知"><label>类型 *</label><textarea class="field" name="description" rows="3" required>${esc(desc)}</textarea><button class="btn primary" type="submit" style="margin-top:12px">保存修改</button></form>`);
 $("editCutForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),episode=Number(f.get("episode")),time_point=String(f.get("time_point")||"").trim(),description=String(f.get("description")||"").trim();if(!episode||episode<1||!time_point||!description){toast("请填写集数、时间点和删减概况");return}const r=await db.from("cut_records").update({episode,time_point,description}).eq("id",id);if(r.error){toast("修改失败："+r.error.message+"。请确认 cut_records 的管理员更新权限。");return}closeModal();toast("删减记录已更新");await refresh();showDetail(c.anime_id)};

function authDialog(){
 if(!db){toast("登录服务未初始化：请检查网络是否能加载 Supabase，并确认 URL / Publishable key 正确");return}

   return;

 $("signupAction").onclick=()=>authSubmit("signup");

async function authSubmit(mode){
 const f=$("authForm"),feedback=$("authFeedback");
 if(!f||!db){toast("登录服务不可用，请刷新页面后重试");return}
 const email=f.querySelector('[name="email"]').value.trim(), password=f.querySelector('[name="password"]').value;
 if(!email||!f.querySelector('[name="email"]').checkValidity()){feedback.style.display="block";feedback.textContent="请输入有效的邮箱地址。";return}
 if(password.length<6){feedback.style.display="block";feedback.textContent="密码至少需要 6 位。";return}
 const buttons=[$("signupAction"),$("signinAction")];buttons.forEach(b=>b.disabled=true);feedback.style.display="block";feedback.textContent=mode==="signup"?"正在创建账号……":"正在登录……";
 try{
   const r=mode==="signup"?await db.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}}):await db.auth.signInWithPassword({email,password});
   if(r.error){feedback.textContent="操作失败："+r.error.message;return}
   if(mode==="signup"){
     if(r.data.session){toast("注册成功，已自动登录");closeModal();await refresh();}
     else {feedback.textContent="注册请求已提交。请检查邮箱并完成验证，然后返回此处登录。若未收到邮件，请检查 Supabase 的邮件验证设置。";}
   }else{toast("登录成功");closeModal();await refresh();}
 }catch(e){feedback.textContent="请求失败："+(e?.message||String(e));}
 finally{buttons.forEach(b=>b.disabled=false)}
}

  $("proposalForm").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const payload={title:d.title.trim(),year:d.year?Number(d.year):null,season:d.season||null,episode:d.episode?Number(d.episode):null,time_point:d.time_point.trim(),description:d.description.trim(),source_note:d.source_note.trim(),cover_url:(d.cover_url||"").trim()||null};

 const r=await db.from("proposals").insert({user_id:currentUser.id,action:d.action,payload,status:"pending"});if(r.error){toast("投稿失败："+r.error.message);return}closeModal();toast("已提交，等待管理员审核");};
}
async function myProposals(){

 const r=await db.from("proposals").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
 if(r.error){host.innerHTML=`<div class="posts-empty posts-error">暂时无法读取投稿记录<br><small>${esc(r.error.message)}</small></div>`;return}
 const items=r.data||[];
 const statusInfo={pending:["待审核","pending"],approved:["已通过","approved"],rejected:["已驳回","rejected"]};
 host.innerHTML=items.length?`<div class="posts-heading"><div><h3>投稿记录</h3><p>共 ${items.length} 条记录，点击卡片可查看提交内容</p></div><span class="posts-total">${items.length} 条</span></div><div class="posts-list">${items.map(p=>{
   const payload=p.payload||{}, st=statusInfo[p.status]||[p.status||"未知状态","unknown"];
   const date=p.created_at?new Date(p.created_at).toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"提交时间未知";
   const note=p.admin_note?`<div class="post-note"><b>审核备注</b><span>${esc(p.admin_note)}</span></div>`:"";
   return `<article class="post-card"><div class="post-card-top"><span class="post-kind"><span class="post-kind-icon">${p.action==="add_cut"?"✂":"▣"}</span>${esc(proposalActionName(p.action))}</span><span class="post-status ${st[1]}"><i></i>${esc(st[0])}</span></div><h4>${esc(payload.title||"未命名番剧")}</h4><div class="post-meta"><span>◷ ${esc(date)}</span>${payload.year?`<span>${esc(payload.year)} 年</span>`:""}${payload.season?`<span>${esc(payload.season)}</span>`:""}${payload.episode?`<span>第 ${esc(payload.episode)} 集</span>`:""}</div>${payload.time_point?`<div class="post-detail"><b>时间点</b><span>${esc(payload.time_point)}</span></div>`:""}${payload.description||payload.cut_description?`<div class="post-description">${esc(payload.description||payload.cut_description)}</div>`:""}${note}<details class="post-more"><summary>查看提交详情</summary>${proposalSummary(payload)}</details></article>`;
 }).join("")}</div>`:`<div class="posts-empty"><div class="posts-empty-icon">✉</div><b>还没有投稿记录</b><p>提交番剧或删减记录后，会在这里显示审核进度。</p><button class="btn primary" type="button" onclick="navigatePage('submit')">＋ 去投稿</button></div>`;
}
function proposalActionName(action){return action==="add_cut"?"新增删减记录":action==="create_anime"?"新增番剧":action||"投稿"}
function proposalSummary(payload={}){
 const rows=[
  ["年份",payload.year],["季度",payload.season],["分类",payload.category],
  ["集数",payload.episode],["删减时间",payload.time_point],["删减概况",payload.cut_description],["删减来源",payload.cut_source_note],["说明/简介",payload.description],
  ["封面",payload.cover_url],["来源",payload.source_note]
 ].filter(([k,v])=>v!==null&&v!==undefined&&String(v).trim()!=="");
 return `<div class="proposal-summary"><div class="proposal-title">${esc(payload.title||"未命名番剧")}</div>${rows.map(([k,v])=>`<div class="proposal-field"><span>${esc(k)}</span><span>${esc(String(v))}</span></div>`).join("")}</div>`;
}
async function adminReview(){if(!isAdmin){toast("当前账号不是管理员");return}const r=await db.from("proposals").select("*").eq("status","pending").order("created_at");if(r.error){toast(r.error.message);return}modal("待审核投稿","核对内容后再批准。新增删减记录必须对应已收录的番剧。",(r.data||[]).map(p=>`<div class="item"><b>${esc(proposalActionName(p.action))}</b>${proposalSummary(p.payload||{})}<input class="field" id="note-${p.id}" placeholder="审核备注（选填）"><div class="row"><button class="btn plain" onclick="review('${p.id}','reject')">驳回</button><button class="btn primary" onclick="review('${p.id}','approve')">批准并发布</button></div></div>`).join("")||'<p>当前没有待审核投稿。</p>')}
async function syncApprovedProposal(proposalId){const q=await db.from("proposals").select("*").eq("id",proposalId).maybeSingle();if(q.error||!q.data)return;const p=q.data,pl=p.payload||{};if(p.action==="create_anime"){let aq=await db.from("anime").select("*").ilike("title",String(pl.title||"").trim()).limit(1);if(aq.error||!aq.data?.length)return;const a=aq.data[0],fields={};if(pl.cover_url)fields.cover_url=pl.cover_url;if(pl.category)fields.category=pl.category;if(pl.source_note)fields.source_note=pl.source_note;if(pl.description)fields.description=pl.description;if(Object.keys(fields).length)await db.from("anime").update(fields).eq("id",a.id);if(Number(pl.episode)&&pl.time_point&&(pl.cut_description||pl.description)){const tp=String(pl.time_point).trim(),ep=Number(pl.episode),existing=await db.from("cut_records").select("id").eq("anime_id",a.id).eq("episode",ep).eq("time_point",tp).limit(1);if(!existing.data?.length)await db.from("cut_records").insert({anime_id:a.id,episode:ep,time_point:tp,description:pl.cut_description||pl.description,source_note:pl.cut_source_note||pl.source_note||null});}}else if(p.action==="add_cut"){const a=pl.anime_id?{id:pl.anime_id}:null;if(a&&Number(pl.episode)&&pl.time_point&&pl.description){const existing=await db.from("cut_records").select("id").eq("anime_id",a.id).eq("episode",Number(pl.episode)).eq("time_point",String(pl.time_point).trim()).limit(1);if(!existing.data?.length)await db.from("cut_records").insert({anime_id:a.id,episode:Number(pl.episode),time_point:String(pl.time_point).trim(),description:pl.description,source_note:pl.source_note||null});}}}
async function review(id,decision){const note=$("note-"+id)?.value||"";const r=await db.rpc("review_proposal",{p_proposal_id:id,p_decision:decision,p_admin_note:note});if(r.error){const msg=r.error.message||String(r.error);if(msg.includes("正式档案中找不到该番剧")){toast("发布失败：档案里还没有这部番剧。请先新增番剧并审核通过，再提交删减记录。");}else if(msg.includes("管理员")||msg.includes("admin")){toast("审核失败：当前账号没有管理员权限，请检查 profiles.is_admin。");}else{toast("审核失败："+msg);}return}if(decision==="approve")await syncApprovedProposal(id);toast(decision==="approve"?"已批准并同步发布番剧/删减记录":"已驳回");adminReview();refresh()}
window.navigatePage=function(page){
 document.querySelectorAll("[data-page]").forEach(el=>el.classList.toggle("active",el.dataset.page===page));
 const welcome=$("homeWelcome"), layout=$("contentLayout");
 if(welcome)welcome.classList.toggle("page-hidden",page!=="home");
 if(layout){layout.classList.toggle("page-hidden",page==="home"||page==="admin");layout.classList.toggle("page-single",["directory","submit","my-posts"].includes(page));}
 document.querySelectorAll("[data-page-section]").forEach(el=>{
   const section=el.dataset.pageSection;
   el.classList.toggle("page-hidden",!(section===page));
 });
 if(page==="my-posts")myProposals();
 if(page==="admin")adminReview();
 window.scrollTo({top:0,behavior:"smooth"});
};
document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();navigatePage(el.dataset.page)}));
const submitPanelBtn=$("submitPanelBtn"); if(submitPanelBtn) submitPanelBtn.onclick=()=>navigatePage("submit");
const browseDirectoryBtn=$("browseDirectoryBtn"); if(browseDirectoryBtn){browseDirectoryBtn.type="button";browseDirectoryBtn.addEventListener("click",e=>{e.preventDefault();navigatePage("directory");requestAnimationFrame(()=>$("directory")?.scrollIntoView({behavior:"smooth",block:"start"}));});}
$("authBtn").onclick=authDialog;
$("submitBtn").onclick=()=>navigatePage("submit");$("myPropsBtn").onclick=myProposals;$("adminBtn").onclick=adminReview;$("close").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};["search","season","year"].forEach(id=>$(id).addEventListener("input",render));

const inlineYear = $("newAnimeYear");
if(inlineYear){const now=new Date().getFullYear();for(let y=now;y>=1950;y--){const op=document.createElement("option");op.value=String(y);op.textContent=y+"年";inlineYear.appendChild(op)}}
function updateSubmissionType(){
 const type=$("submissionType").value, isNew=type==="create_anime";
 $("newAnimeFields").style.display=isNew?"block":"none";
 $("existingAnimeFields").style.display=isNew?"none":"block";
 ["newAnimeTitle","newAnimeSeason","newAnimeYear"].forEach(id=>$(id).required=isNew);
 ["existingAnimeSelect","cutEpisode","cutTimePoint","cutDescription"].forEach(id=>$(id).required=!isNew);
 const select=$("existingAnimeSelect"), selected=select.value;
 select.innerHTML='<option value="">请选择番剧</option>'+records.slice().sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"zh-CN")).map(a=>`<option value="${esc(a.id)}">${esc(a.title)}${a.year?`（${esc(a.year)}）`:""}</option>`).join("");
 if(selected)select.value=selected;
 $("submitIntro").textContent=isNew?"新增番剧：填写基本信息后提交。":"已收录番剧：选择番剧并填写删减集数、时间点和说明。";
}
$("submissionType").addEventListener("change",updateSubmissionType);
$("inlineProposalForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!db){toast("投稿服务未初始化，请检查 Supabase 配置和网络");return}
 if(!currentUser){toast("请先登录后再投稿");authDialog();return}
 const form=e.currentTarget, submit=$("inlineSubmitButton"), type=$("submissionType").value;
 let action, payload;
 if(type==="create_anime"){
   const title=$("newAnimeTitle").value.trim(), season=$("newAnimeSeason").value, year=$("newAnimeYear").value;
   if(!title||!season||!year||!$("inlineCoverUrl").value.trim()){toast("请填写番剧名称、季度、年份和封面图片 URL");return}
   const firstEpisode=Number($("newAnimeCutEpisode").value)||null, firstTimePoint=$("newAnimeCutTimePoint").value.trim(), firstCutDescription=$("newAnimeCutDescription").value.trim();
   if((firstEpisode||firstTimePoint||firstCutDescription)&&(!firstEpisode||firstEpisode<1||!firstTimePoint||!firstCutDescription)){toast("如果填写首条删减记录，请同时填写集数、时间点和类型");return}
   payload={title,year:Number(year),season,category:$("newAnimeCategory").value||"TV动画",cover_url:$("inlineCoverUrl").value.trim(),description:$("newAnimeDescription").value.trim()||null,episode:firstEpisode,time_point:firstTimePoint||null,cut_description:firstCutDescription||null};
   action="create_anime";
 }else{
   const anime=records.find(a=>a.id===$("existingAnimeSelect").value);
   const episode=Number($("cutEpisode").value), timePoint=$("cutTimePoint").value.trim(), description=$("cutDescription").value.trim();
   if(!anime){toast("请先选择一部已收录番剧");return}
   if(!episode||episode<1||!timePoint||!description){toast("请填写集数、删减时间点和说明");return}
   payload={title:anime.title,anime_id:anime.id,year:anime.year??null,season:anime.season??null,episode,time_point:timePoint,description};
   action="add_cut";
 }
 submit.disabled=true;submit.textContent=isAdmin?"正在发布……":"正在提交……";
 try{
   const inserted=await db.from("proposals").insert({user_id:currentUser.id,action,payload,status:"pending"}).select("id").single();
   if(inserted.error){toast("投稿失败："+inserted.error.message);return}
   if(isAdmin){
     const reviewed=await db.rpc("review_proposal",{p_proposal_id:inserted.data.id,p_decision:"approve",p_admin_note:"管理员投稿，自动发布"});
     if(reviewed.error){toast("投稿已保存，但直接发布失败："+reviewed.error.message+"。请到管理员审核页完成发布。");return}
     toast("管理员投稿成功，已直接发布");
   }else toast("投稿成功，已提交管理员审核");
   form.reset();updateSubmissionType();await refresh();
 }catch(err){toast("投稿请求失败："+(err?.message||String(err)))}
 finally{submit.disabled=false;submit.textContent="➤ 提交投稿"}
});

navigatePage("home");
if(db){db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh()}else refresh();
</script></body></html>
