<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>投稿审核 · 番剧档案馆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--paper:#fff;--ink:#20243a;--muted:#737991;--line:#e7e9f2;--brand:#6558d9;--green:#16845b;--red:#b83b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(960px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:18px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:white}.plain{background:white;border:1px solid var(--line);color:var(--ink)}.approve{background:#e4f6ee;color:var(--green)}.reject{background:#fff0f1;color:var(--red)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}.muted{color:var(--muted)}.notice{padding:12px;background:#f0eeff;border-radius:10px;margin:12px 0}.item{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;background:#fff}.item h3{margin:0 0 4px}.pill{display:inline-block;padding:2px 8px;border-radius:8px;background:#f0eeff;color:#6558d9;font-size:12px}.payload{background:#f8f9fc;border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:8px 0}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.login{max-width:420px;margin:28px auto}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#22243b;color:#fff;border-radius:10px;padding:10px 14px;display:none;max-width:90vw}.toast.show{display:block}footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}
</style></head><body>
<header class="top"><div class="wrap nav"><div class="brand">🗂️ 番剧档案馆 / 投稿审核</div><div><a href="./index.html"><button class="btn plain">返回网站</button></a> <button id="logout" class="btn plain hidden">退出登录</button></div></div></header>
<main class="wrap"><section class="panel"><h1 style="margin:0">管理员审核中心</h1><p class="muted">批准后才会合并到正式档案；驳回不会公开。</p><div id="status" class="notice">正在检查登录状态……</div></section>
<section id="loginBox" class="panel login hidden"><h2>管理员登录</h2><p class="muted">使用你在番剧档案馆注册的邮箱账号登录。</p><form id="loginForm"><label>邮箱</label><input class="field" name="email" type="email" required><label>密码</label><input class="field" name="password" type="password" minlength="6" required><button class="btn primary" type="submit">登录</button></form></section>
<section id="queue" class="panel hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">待审核投稿 <span id="count" class="pill">0</span></h2><button id="reload" class="btn plain">刷新列表</button></div><div id="items"></div></section>
</main><footer>请勿将 Supabase Secret / service_role 密钥放进网页。</footer><div id="toast" class="toast"></div>
<script>
// 将下面两项替换成你自己的 Supabase Project URL 和 Publishable key。
const SUPABASE_URL="https://zmrrygvatvcxlegycydw.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_9AVSujXZOvBGwVK6DoSvOA__GjsnX4S";
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id);let user=null,isAdmin=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)}
function status(s){$('status').textContent=s}
async function boot(){if(!db){status('尚未配置 Supabase。请编辑 admin.html，填入 Project URL 和 Publishable key。');$('loginBox').classList.remove('hidden');return}const {data}=await db.auth.getSession();user=data.session?.user||null;await checkUser();db.auth.onAuthStateChange(()=>setTimeout(boot,0))}
async function checkUser(){if(!user){isAdmin=false;$('loginBox').classList.remove('hidden');$('queue').classList.add('hidden');$('logout').classList.add('hidden');status('请先登录管理员账号。');return}const p=await db.from('profiles').select('is_admin').eq('id',user.id).maybeSingle();isAdmin=!!p.data?.is_admin;$('logout').classList.remove('hidden');if(!isAdmin){$('loginBox').classList.add('hidden');$('queue').classList.add('hidden');status('当前账号不是管理员。请使用你的管理员账号，或先在 Supabase 中设置 profiles.is_admin=true。');return}$('loginBox').classList.add('hidden');$('queue').classList.remove('hidden');status('管理员身份已确认。以下是待审核投稿。');await loadQueue()}
async function loadQueue(){if(!isAdmin)return;status('正在读取待审核投稿……');const r=await db.from('proposals').select('*').eq('status','pending').order('created_at',{ascending:true});if(r.error){status('读取失败：'+r.error.message+'。请先运行下方说明中的审核权限 SQL。');return}const rows=r.data||[];$('count').textContent=rows.length;$('items').innerHTML=rows.length?rows.map(p=>`<article class="item"><div class="pill">${esc(p.action)}</div><h3>${esc(p.payload?.title||'未命名投稿')}</h3><p class="muted">提交时间：${esc(p.created_at||'未知')} · 投稿 ID：${esc(p.id)}</p><div class="payload">${esc(JSON.stringify(p.payload,null,2))}</div><textarea class="field" id="note-${esc(p.id)}" rows="2" placeholder="审核备注（选填）"></textarea><div class="actions"><button class="btn reject" onclick="review('${esc(p.id)}','reject')">驳回</button><button class="btn approve" onclick="review('${esc(p.id)}','approve')">批准并合并</button></div></article>`).join(''):'<p class="muted">目前没有待审核投稿。</p>';status('加载完成。审核通过后会将支持的投稿合并到正式档案。')}
async function review(id,decision){if(!isAdmin){toast('没有管理员权限');return}const note=$('note-'+id)?.value||'';const r=await db.rpc('review_proposal',{p_proposal_id:id,p_decision:decision,p_admin_note:note});if(r.error){toast('审核失败：'+r.error.message);return}toast(decision==='approve'?'已批准并合并':'已驳回');await loadQueue()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db){toast('请先配置 Supabase');return}const f=e.currentTarget;const r=await db.auth.signInWithPassword({email:f.email.value,password:f.password.value});if(r.error){toast('登录失败：'+r.error.message);return}user=r.data.user;await checkUser()});$('logout').onclick=async()=>{await db.auth.signOut();user=null;await checkUser()};$('reload').onclick=loadQueue;boot();
</script></body></html>
